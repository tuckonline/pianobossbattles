services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pianopath
      POSTGRES_PASSWORD: pianopath
      POSTGRES_DB: pianopath
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pianopath-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pianopath"]
      interval: 5s
      retries: 10
volumes:
  pianopath-data:
